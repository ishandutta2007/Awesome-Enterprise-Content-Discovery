<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .tag {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .float-node {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg)"/>

  <!-- Dynamic / Animated Background Wave Elements -->
  <g class="pulse-node">
    <circle cx="1050" cy="80" r="180" fill="url(#glow)"/>
    <circle cx="150" cy="280" r="140" fill="url(#glow)"/>
  </g>

  <!-- Network Knowledge Graph Lines (Background layer) -->
  <g stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4">
    <line x1="820" y1="100" x2="940" y2="160"/>
    <line x1="940" y1="160" x2="1080" y2="110"/>
    <line x1="940" y1="160" x2="880" y2="250"/>
    <line x1="1080" y1="110" x2="1040" y2="240"/>
    <line x1="880" y1="250" x2="1040" y2="240"/>
  </g>

  <!-- Dynamic Animated Graph Nodes (Background) -->
  <g class="float-node">
    <circle cx="820" cy="100" r="6" fill="#38bdf8" opacity="0.8"/>
    <circle cx="940" cy="160" r="9" fill="#818cf8" opacity="0.9"/>
    <circle cx="1080" cy="110" r="7" fill="#c084fc" opacity="0.8"/>
    <circle cx="880" cy="250" r="8" fill="#34d399" opacity="0.8"/>
    <circle cx="1040" cy="240" r="10" fill="#f472b6" opacity="0.9"/>

    <path d="M940 160 L1040 240" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent)"/>

  <!-- Foreground Content Container -->
  <g transform="translate(70, 0)">
    <!-- Badge Tag -->
    <rect x="0" y="55" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="75" class="tag">🔍 ENTERPRISE CONTENT DISCOVERY</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#shadow)">
      Awesome Enterprise Content Discovery
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="195" class="subtitle">
      Curated List of SaaS Platforms &amp; Open-Source Knowledge Discovery Systems
    </text>

    <!-- Subtitle Line 2 (Tags) -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="22" font-family="system-ui" font-size="14" font-weight="600" fill="#38bdf8">🌐 Federated Search</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="190" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="188" y="22" font-family="system-ui" font-size="14" font-weight="600" fill="#818cf8">🧠 Permission-Aware RAG</text>

      <!-- Pill 3 -->
      <rect x="374" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="390" y="22" font-family="system-ui" font-size="14" font-weight="600" fill="#c084fc">⚡ Knowledge Discovery</text>
    </g>

    <!-- Bottom Metadata -->
    <text x="0" y="305" font-family="system-ui" font-size="13" fill="#64748b">
      Last Updated: October 2026 • Community-Curated Stack &amp; Benchmarks
    </text>
  </g>
</svg>
